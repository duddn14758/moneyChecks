<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가계부</title>

<link rel="manifest" href="/moneyChecks/manifest.json">
<meta name="theme-color" content="#4CAF50">
  
<style>
* { box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f6f8;
  margin: 0;
}

.container {
  max-width: 480px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

input, select {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border-radius: 10px;
  border: 1px solid #ddd;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

.primary { background: #4CAF50; color: white; }
.danger { background: #ff4d4f; color: white; }
.logout { background: #999; color: white; }

.top-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.top-bar .logout {
  flex: 1;
}

.icon-nav {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}

.icon-nav button {
  background: #fff;
  color: #333;
  border: 1px solid #e5e5e5;
  font-size: 13px;
  padding: 10px 6px;
}

.icon-nav button.active {
  background: #4CAF50;
  color: #fff;
  border-color: #4CAF50;
}

.view { display: none; }
.view.active { display: block; }

.row { display: flex; gap: 10px; }
.row > * { flex: 1; }

.record {
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

.date {
  font-size: 12px;
  color: #999;
  margin-bottom: 6px;
}

.row-line {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.content {
  font-size: 15px;
  font-weight: 500;
  flex: 1;
  margin-right: 10px;
}

.right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.amount {
  font-weight: bold;
  white-space: nowrap;
}

button.small {
  padding: 6px 10px;
  font-size: 12px;
  border-radius: 8px;
}

.secondary {
  background: #edf3ee;
  color: #2f6f35;
}

.empty {
  color: #999;
  padding: 12px 0;
  text-align: center;
}

.stats-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.stats-head input {
  margin: 0;
}

.total {
  font-size: 20px;
  font-weight: 800;
  margin: 8px 0 14px;
}

#expenseChart {
  width: 100%;
  max-width: 280px;
  aspect-ratio: 1;
  display: block;
  margin: 0 auto 14px;
}

.legend-item {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid #eee;
  font-size: 14px;
}

.legend-label {
  display: flex;
  align-items: center;
  gap: 8px;
}

.swatch {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex: 0 0 12px;
}
</style>
</head>

<body>

<div class="container">
<h2>🐿️ 가계부</h2>

<div id="loginBox" class="card">
  <input type="password" id="pw" placeholder="비밀번호">
  <button class="primary" onclick="login()">입장</button>
</div>

<div id="app" style="display:none;">

  <div class="top-bar">
    <button class="logout" onclick="logout()">로그아웃</button>
  </div>

  <div class="icon-nav">
    <button id="navInput" class="active" onclick="showView('input')" title="입력">✍️<br>입력</button>
    <button id="navHistory" onclick="showView('history')" title="히스토리">🧾<br>히스토리</button>
    <button id="navStats" onclick="showView('stats')" title="통계">📊<br>통계</button>
  </div>

  <div id="inputView" class="view active">
    <div class="card">
      <input type="date" id="date">
      <select id="category"></select>
      <input type="text" id="tag" placeholder="태그 (예: 수입, 지출)">
      <input type="text" id="content" placeholder="내용">
      <input type="number" id="amount" placeholder="금액">

      <div class="row">
        <select id="inAccount"></select>
        <select id="outAccount"></select>
      </div>

      <button class="primary" onclick="save()">저장</button>
    </div>
  </div>

  <div id="historyView" class="view">
    <div class="card" id="list"></div>
    <button id="loadMoreBtn" class="secondary" onclick="loadMoreRecords()" style="display:none;">더보기</button>
  </div>

  <div id="statsView" class="view">
    <div class="card">
      <div class="stats-head">
        <strong id="statsTitle">이번달 지출</strong>
        <input type="month" id="statsMonth" onchange="loadStats()">
      </div>
      <div id="statsTotal" class="total">0원</div>
      <canvas id="expenseChart" width="280" height="280"></canvas>
      <div id="statsLegend"></div>
    </div>
  </div>

</div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxlLPnT4CNBW6tF1deU0T151dvb7_IrgXO-cZdoQOwLYSbE2Z3XCjoMOUd-zHyZCcVm/exec";

  "지출  ›  🎁 경조사·선물  ›  조카 용돈🐥",
  "지출  ›  🎁 경조사·선물  ›  경조사비📩",
  "지출  ›  🎁 경조사·선물  ›  사례금🙏",
  "지출  ›  📚 자기계발  ›  자격증 응시료✍️",
  "지출  ›  📚 자기계발  ›  강의·클래스💻",
  "지출  ›  📚 자기계발  ›  자기계발 도서📖",
  "지출  ›  📚 자기계발  ›  학원비🎒"
];
const HARDCODED_ACCOUNTS = [
  "💵 기업은행 허브",
  "💳 삼성신용카드(공금)",
  "💵 카카오계좌(공금)",
  "💵 카카오계좌(여행)",
  "💵 영우 CMA",
  "💵 서희 CMA",
  "🔒 서희 ISA 중개형",
  "🐷 청년도약계좌",
  "📉 주택담보대출",
  "📈 영우 주식",
  "🐷 영우 청약",
  "🐷 서희 청약",
  "🔒 영우 개인 IRP",
  "🔒 서희 개인 IRP",
  "🔒 영우 연금저축",
  "🔒 서희 연금저축",
  "🚀 쿠팡신용카드"
];

let SECRET = "";
let categories = [];
let records = [];
let accounts = [];
let recordsNextOffset = 0;
let recordsHasMore = false;
let currentView = "input";
let recordsLoaded = false;
let recordsLoading = false;
let statsData = null;
let statsLoadedMonth = "";
let statsLoading = false;
let dataVersion = 0;
const PAGE_SIZE = 10;
const CHART_COLORS = ["#4CAF50", "#ff9800", "#42a5f5", "#ec407a", "#ab47bc", "#26a69a", "#8d6e63", "#78909c", "#fdd835", "#ef5350"];

window.onload = function () {
  const saved = localStorage.getItem("secret");
  if (saved) {
    SECRET = saved;
    initApp();
  }
};

function login() {
  const pw = document.getElementById("pw").value;
  if (!pw) return alert("비밀번호 입력");

  SECRET = pw;
  localStorage.setItem("secret", pw);
  initApp();
}

function logout() {
  localStorage.removeItem("secret");
  location.reload();
}

function initApp() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("date").valueAsDate = new Date();
  document.getElementById("statsMonth").value = getCurrentMonthValue();
  loadData();
  preloadSecondaryData();
}

function loadData() {
  categories = HARDCODED_CATEGORIES;
  accounts = HARDCODED_ACCOUNTS;

  renderCategory();
  renderAccounts();
}

function showView(view) {
  currentView = view;

  ["input", "history", "stats"].forEach(name => {
    document.getElementById(`${name}View`).classList.toggle("active", name === view);
    document.getElementById(`nav${capitalize(name)}`).classList.toggle("active", name === view);
  });

  if (view === "history") {
    if (recordsLoaded) {
      renderList();
    } else {
      loadRecords(true);
    }
  }

  if (view === "stats") {
    const monthValue = document.getElementById("statsMonth").value || getCurrentMonthValue();
    if (statsData && statsLoadedMonth === monthValue) {
      renderStats(statsData);
    } else {
      loadStats();
    }
  }
}

function preloadSecondaryData(force) {
  setTimeout(() => {
    loadRecords(true, true, force);
    loadStats(true, force);
  }, 200);
}

function capitalize(value) {
  return value.charAt(0).toUpperCase() + value.slice(1);
}

function renderCategory() {
  const select = document.getElementById("category");
  select.innerHTML = `<option value="">카테고리 선택</option>`;
  categories.forEach(c => {
    const value = c.value || c;
    select.innerHTML += `<option value="${value}">${value}</option>`;
  });
}

function renderAccounts() {
  const inSelect = document.getElementById("inAccount");
  const outSelect = document.getElementById("outAccount");

  inSelect.innerHTML = `
    <option value="">입금계좌 (선택안함)</option>
    <option value="">- 없음 -</option>
  `;

  outSelect.innerHTML = `
    <option value="">출금계좌 (선택안함)</option>
    <option value="">- 없음 -</option>
  `;

  accounts.forEach(acc => {
    inSelect.innerHTML += `<option value="${acc}">${acc}</option>`;
    outSelect.innerHTML += `<option value="${acc}">${acc}</option>`;
  });
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,"0")}-${d.getDate().toString().padStart(2,"0")}`;
}

function renderList() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  if (!records.length) {
    list.innerHTML = `<div class="empty">기록이 없습니다.</div>`;
  }

  records.forEach(r => {
    list.innerHTML += `
      <div class="record">
        <div class="date">${formatDate(r.date)}</div>
        <div class="row-line">
          <div class="content">${r.content}</div>
          <div class="right">
            <div class="amount">${Number(r.amount).toLocaleString()}원</div>
            <button class="danger small" onclick="remove(${r.rowIndex})">삭제</button>
          </div>
        </div>
      </div>
    `;
  });

  document.getElementById("loadMoreBtn").style.display = recordsHasMore ? "block" : "none";
}

function loadRecords(reset, silent, force) {
  if (recordsLoading && !force) {
    return;
  }

  recordsLoading = true;
  const requestVersion = dataVersion;
  const offset = reset ? 0 : recordsNextOffset;

  fetch(`${API}?action=records&offset=${offset}&limit=${PAGE_SIZE}`)
    .then(res => res.json())
    .then(data => {
      if (requestVersion !== dataVersion) {
        return;
      }

      records = reset ? (data.records || []) : records.concat(data.records || []);
      recordsNextOffset = data.nextOffset || records.length;
      recordsHasMore = !!data.hasMore;
      recordsLoaded = true;
      if (!silent || currentView === "history") {
        renderList();
      }
    })
    .catch(() => {
      if (!silent) {
        alert("히스토리 불러오기 실패");
      }
    })
    .finally(() => {
      recordsLoading = false;
    });
}

function loadMoreRecords() {
  if (recordsHasMore) {
    loadRecords(false);
  }
}

function save() {
  const rawDate = document.getElementById("date").value;

  const data = {
    action: "add",
    secret: SECRET,
    date: rawDate.replaceAll("-", "/"),
    type: document.getElementById("category").value,
    tag: document.getElementById("tag").value,
    content: document.getElementById("content").value,
    amount: Number(document.getElementById("amount").value),
    inAccount: document.getElementById("inAccount").value,
    outAccount: document.getElementById("outAccount").value
  };

  if (!data.type || !data.amount) {
    return alert("필수값 입력");
  }

  fetch(API, {
    method: "POST",
    body: JSON.stringify(data)
  }).then(() => {
    alert("저장되었습니다 ✅");   // 👈 추가

    document.getElementById("content").value = "";
    document.getElementById("amount").value = "";

    dataVersion++;
    recordsLoaded = false;
    statsData = null;

    if (currentView === "history") {
      loadRecords(true, false, true);
    }

    if (currentView === "stats") {
      loadStats(false, true);
    }

    if (currentView === "input") {
      preloadSecondaryData(true);
    }
  });
}

function remove(rowIndex) {
  if (!confirm("정말 삭제하시겠습니까?")) return;

  fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "delete",
      secret: SECRET,
      rowIndex
    })
  }).then(() => {
    dataVersion++;
    recordsLoaded = false;
    statsData = null;
    loadRecords(true, false, true);
  });
}

function getCurrentMonthValue() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function loadStats(silent, force) {
  if (statsLoading && !force) {
    return;
  }

  statsLoading = true;
  const requestVersion = dataVersion;
  const monthValue = document.getElementById("statsMonth").value || getCurrentMonthValue();
  const [year, month] = monthValue.split("-");

  fetch(`${API}?action=monthlyStats&year=${year}&month=${Number(month)}`)
    .then(res => res.json())
    .then(data => {
      if (requestVersion !== dataVersion) {
        return;
      }

      statsData = data;
      statsLoadedMonth = monthValue;
      if (!silent || currentView === "stats") {
        renderStats(data);
      }
    })
    .catch(() => {
      if (!silent) {
        alert("통계 불러오기 실패");
      }
    })
    .finally(() => {
      statsLoading = false;
    });
}

function renderStats(data) {
  const items = data.items || [];
  const total = Number(data.total) || 0;

  document.getElementById("statsTitle").textContent = `${data.year}년 ${data.month}월 지출`;
  document.getElementById("statsTotal").textContent = `${total.toLocaleString()}원`;

  drawPieChart(items, total);
  renderStatsLegend(items, total);
}

function drawPieChart(items, total) {
  const canvas = document.getElementById("expenseChart");
  const ctx = canvas.getContext("2d");
  const center = canvas.width / 2;
  const radius = center - 10;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!items.length || !total) {
    ctx.fillStyle = "#f0f0f0";
    ctx.beginPath();
    ctx.arc(center, center, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#999";
    ctx.font = "bold 16px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("지출 없음", center, center);
    return;
  }

  let startAngle = -Math.PI / 2;
  items.forEach((item, index) => {
    const slice = (Number(item.amount) / total) * Math.PI * 2;
    ctx.fillStyle = CHART_COLORS[index % CHART_COLORS.length];
    ctx.beginPath();
    ctx.moveTo(center, center);
    ctx.arc(center, center, radius, startAngle, startAngle + slice);
    ctx.closePath();
    ctx.fill();
    startAngle += slice;
  });

  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(center, center, radius * 0.45, 0, Math.PI * 2);
  ctx.fill();
}

function renderStatsLegend(items, total) {
  const legend = document.getElementById("statsLegend");

  if (!items.length || !total) {
    legend.innerHTML = `<div class="empty">이번달 지출 기록이 없습니다.</div>`;
    return;
  }

  legend.innerHTML = items.map((item, index) => {
    const amount = Number(item.amount) || 0;
    const percent = Math.round((amount / total) * 100);
    return `
      <div class="legend-item">
        <div class="legend-label">
          <span class="swatch" style="background:${CHART_COLORS[index % CHART_COLORS.length]}"></span>
          <span>${formatCategoryLabel(item.label)}</span>
        </div>
        <strong>${amount.toLocaleString()}원 (${percent}%)</strong>
      </div>
    `;
  }).join("");
}

function formatCategoryLabel(label) {
  const parts = String(label || "기타").split(">").map(part => part.trim()).filter(Boolean);
  return parts.length ? parts[parts.length - 1] : "기타";
}
